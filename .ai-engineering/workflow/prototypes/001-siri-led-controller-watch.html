<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Siri LED Controller — Apple Watch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Pro+Text:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --watch-width: 410px;
      --watch-height: 502px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --radius-full: 9999px;
      --spacing-1: 4px;
      --spacing-2: 8px;
      --spacing-3: 12px;
      --spacing-4: 16px;
      --spacing-5: 20px;
      --spacing-6: 24px;
      --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-text: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --bg-primary: #000000;
      --bg-secondary: #1c1c1e;
      --bg-tertiary: #2c2c2e;
      --fg-primary: #ffffff;
      --fg-secondary: #8e8e93;
      --fg-tertiary: #48484a;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-orange: #ff9f0a;
      --accent-red: #ff3b30;
      --accent-purple: #af52de;
      --accent-pink: #ff2d92;
      --border-color: #38383a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
      --crown-speed: 0.15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg-primary); color: var(--fg-primary); font-family: var(--font-text); -webkit-font-smoothing: antialiased; }

    .watch-frame {
      width: var(--watch-width);
      height: var(--watch-height);
      background: var(--bg-primary);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .screen::-webkit-scrollbar { display: none; }

    .screen-content { padding: var(--spacing-4); display: flex; flex-direction: column; gap: var(--spacing-3); }

    .app-title { font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.02em; padding-top: var(--spacing-2); }

    .device-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-3) var(--spacing-4);
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      min-height: 64px;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.05s ease;
      border: 1px solid var(--border-color);
    }
    .device-row:hover { background: var(--bg-tertiary); }
    .device-row:active { transform: scale(0.98); }

    .device-color-preview {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      border: 2px solid var(--border-color);
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .device-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .device-name { font-family: var(--font-display); font-weight: 500; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-room { font-size: 13px; color: var(--fg-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }
    .status-dot.connected { background: var(--accent-green); }
    .status-dot.connecting { background: var(--accent-orange); animation: pulse 1.5s ease-in-out infinite; }
    .status-dot.disconnected { background: var(--fg-tertiary); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .power-toggle { width: 52px; height: 32px; position: relative; flex-shrink: 0; }
    .power-toggle input { display: none; }
    .power-toggle .toggle-track {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-full);
      background: var(--fg-tertiary);
      border: 1px solid var(--border-color);
      transition: background 0.2s ease, border-color 0.2s ease;
      position: relative;
    }
    .power-toggle .toggle-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--fg-primary);
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), background 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .power-toggle input:checked + .toggle-track { background: var(--accent-green); border-color: var(--accent-green); }
    .power-toggle input:checked + .toggle-track .toggle-thumb { transform: translateX(20px); }
    .power-toggle .toggle-thumb svg { width: 14px; height: 14px; color: var(--bg-primary); }

    .chevron { width: 16px; height: 16px; color: var(--fg-tertiary); flex-shrink: 0; margin-left: var(--spacing-2); }

    .detail-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-3);
      padding: var(--spacing-2) 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: var(--spacing-2);
    }
    .back-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--bg-secondary); border: 1px solid var(--border-color); cursor: pointer; transition: background 0.1s ease; }
    .back-btn:hover { background: var(--bg-tertiary); }
    .back-btn:active { transform: scale(0.95); }
    .detail-title { flex: 1; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.02em; }

    .control-section { display: flex; flex-direction: column; gap: var(--spacing-4); }
    .control-label { font-size: 13px; font-weight: 500; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

    .large-power-toggle { width: 88px; height: 88px; border-radius: var(--radius-full); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto; transition: transform 0.1s ease, box-shadow 0.2s ease; box-shadow: var(--shadow-md); }
    .large-power-toggle:active { transform: scale(0.95); }
    .large-power-toggle.on { background: radial-gradient(circle at 30% 30%, #6ae67a, var(--accent-green)); box-shadow: 0 0 30px rgba(52, 199, 89, 0.5), var(--shadow-md); }
    .large-power-toggle.off { background: linear-gradient(180deg, var(--bg-tertiary), var(--bg-secondary)); border: 1px solid var(--border-color); }
    .large-power-toggle svg { width: 36px; height: 36px; transition: color 0.2s ease; }
    .large-power-toggle.on svg { color: #002808; }
    .large-power-toggle.off svg { color: var(--fg-secondary); }

    .intensity-control { display: flex; flex-direction: column; gap: var(--spacing-3); }
    .intensity-header { display: flex; justify-content: space-between; align-items: center; }
    .intensity-value { font-family: var(--font-display); font-weight: 600; font-size: 28px; letter-spacing: -0.02em; }
    .intensity-unit { font-size: 13px; color: var(--fg-secondary); margin-left: 2px; }

    .slider-container { position: relative; height: 44px; }
    .slider-track {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 6px;
      border-radius: var(--radius-full);
      background: var(--bg-tertiary);
      transform: translateY(-50%);
    }
    .slider-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      border-radius: var(--radius-full);
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-blue));
      transition: width 0.1s ease-out;
    }
    .slider-thumb {
      position: absolute;
      top: 50%;
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      background: var(--fg-primary);
      box-shadow: var(--shadow-md);
      transform: translate(-50%, -50%);
      cursor: grab;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      z-index: 2;
    }
    .slider-thumb:hover { transform: translate(-50%, -50%) scale(1.1); box-shadow: var(--shadow-lg); }
    .slider-thumb:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.15); }
    .slider-marks { position: absolute; top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); pointer-events: none; }
    .slider-mark { position: absolute; top: 50%; width: 2px; height: 12px; background: var(--fg-tertiary); transform: translate(-50%, -50%); }
    .slider-mark:nth-child(1) { left: 0%; }
    .slider-mark:nth-child(2) { left: 25%; }
    .slider-mark:nth-child(3) { left: 50%; }
    .slider-mark:nth-child(4) { left: 75%; }
    .slider-mark:nth-child(5) { left: 100%; }

    .color-temp-picker { display: flex; gap: var(--spacing-2); }
    .temp-segment {
      flex: 1;
      padding: var(--spacing-3) var(--spacing-2);
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      min-height: 68px;
    }
    .temp-segment:hover { background: var(--bg-tertiary); }
    .temp-segment:active { transform: scale(0.98); }
    .temp-segment.active {
      background: linear-gradient(180deg, var(--accent-blue), var(--accent-purple));
      border-color: transparent;
      box-shadow: 0 4px 16px rgba(0, 122, 255, 0.3);
    }
    .temp-segment.active .temp-icon { color: var(--fg-primary); }
    .temp-segment.active .temp-label { color: var(--fg-primary); font-weight: 600; }
    .temp-icon { width: 24px; height: 24px; color: var(--fg-secondary); transition: color 0.15s ease; }
    .temp-label { font-size: 11px; font-weight: 500; color: var(--fg-secondary); text-transform: uppercase; letter-spacing: 0.03em; transition: color 0.15s ease; }

    .quick-off-btn {
      width: 100%;
      padding: var(--spacing-4);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--accent-red);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.1s ease;
      margin-top: var(--spacing-2);
    }
    .quick-off-btn:hover { background: rgba(255, 59, 48, 0.1); border-color: var(--accent-red); }
    .quick-off-btn:active { background: rgba(255, 59, 48, 0.2); transform: scale(0.98); }

    .complication-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: var(--spacing-4); text-align: center; padding: var(--spacing-4); }
    .complication-circular {
      width: 140px;
      height: 140px;
      border-radius: var(--radius-full);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-2);
      position: relative;
      box-shadow: var(--shadow-md);
    }
    .complication-circular.on { background: radial-gradient(circle at 30% 30%, var(--device-color-bright), var(--device-color)); }
    .complication-circular.off { background: linear-gradient(180deg, var(--bg-tertiary), var(--bg-secondary)); border: 1px solid var(--border-color); }
    .complication-circular .complication-icon { width: 48px; height: 48px; color: var(--fg-primary); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .complication-circular .complication-label { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
    .complication-ring {
      position: absolute;
      inset: -4px;
      border-radius: var(--radius-full);
      border: 3px solid transparent;
      background: conic-gradient(from 0deg, var(--device-color), var(--device-color-bright), var(--device-color));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .complication-circular.on .complication-ring { opacity: 1; animation: spin 4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .complication-modular {
      width: 100%;
      max-width: 340px;
      padding: var(--spacing-4) var(--spacing-5);
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-4);
    }
    .modular-color { width: 48px; height: 48px; border-radius: var(--radius-sm); flex-shrink: 0; box-shadow: var(--shadow-sm); }
    .modular-info { flex: 1; text-align: left; }
    .modular-name { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
    .modular-status { font-size: 13px; font-weight: 500; }
    .modular-status.on { color: var(--accent-green); }
    .modular-status.off { color: var(--fg-tertiary); }
    .modular-toggle { width: 52px; height: 32px; }

    .screen { display: none; }
    .screen.active { display: flex; }

    .state-switcher { position: fixed; top: 12px; right: 12px; z-index: 100; display: flex; gap: 4px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 4px; }
    .state-switcher button { padding: 6px 10px; border: none; background: transparent; color: var(--fg-secondary); font-size: 11px; font-weight: 500; border-radius: 4px; cursor: pointer; transition: all 0.1s ease; white-space: nowrap; }
    .state-switcher button:hover { color: var(--fg-primary); background: var(--bg-tertiary); }
    .state-switcher button.active { color: var(--fg-primary); background: var(--accent-blue); }

    .haptic-feedback { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.1s ease; background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%); }
    .haptic-feedback.active { opacity: 1; }

    @media (max-width: 430px) {
      :root { --watch-width: 100vw; --watch-height: 100vh; --radius-lg: 0; }
      .watch-frame { width: 100vw; height: 100vh; border-radius: 0; box-shadow: none; }
      body { padding: 0; }
    }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <div class="state-switcher" role="group" aria-label="Prototype state">
    <button data-state="device-list" class="active" aria-pressed="true">Device List</button>
    <button data-state="control-detail" aria-pressed="false">Control Detail</button>
    <button data-state="complication-circular" aria-pressed="false">Complication Circular</button>
    <button data-state="complication-modular" aria-pressed="false">Complication Modular</button>
    <button data-state="empty" aria-pressed="false">Empty</button>
    <button data-state="error" aria-pressed="false">Error</button>
  </div>

  <div class="haptic-feedback" id="hapticOverlay" aria-hidden="true"></div>

  <main class="watch-frame" role="application">
    <!-- Screen 1: Device List -->
    <section class="screen active" id="screen-device-list" data-region="device-list" aria-label="Paired LED Controllers">
      <div class="screen-content">
        <header class="app-title" data-region="header">LED Controllers</header>

        <ul role="list" aria-label="Paired devices" id="deviceList">
          <!-- Devices rendered by JS -->
        </ul>

        <div class="empty-state" id="emptyState" style="display: none; text-align: center; padding: var(--spacing-6); color: var(--fg-secondary);">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin: 0 auto var(--spacing-3); opacity: 0.5;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            <path d="M12 5v.01M12 12v.01M12 19v.01"/>
          </svg>
          <p style="font-size: 16px; font-weight: 500; margin-bottom: var(--spacing-1);">No Controllers Paired</p>
          <p style="font-size: 13px;">Add a controller from your iPhone</p>
        </div>

        <div class="error-state" id="errorState" style="display: none; text-align: center; padding: var(--spacing-6);">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-red)" stroke-width="2" style="margin-bottom: var(--spacing-3);">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <p style="font-size: 16px; font-weight: 500; color: var(--accent-red); margin-bottom: var(--spacing-1);">Unable to Load</p>
          <p style="font-size: 13px; color: var(--fg-secondary); margin-bottom: var(--spacing-4);">Check connection to iPhone</p>
          <button class="retry-btn" style="padding: var(--spacing-2) var(--spacing-4); background: var(--accent-blue); border: none; border-radius: var(--radius-sm); color: white; font-weight: 600; font-size: 14px; cursor: pointer;">Retry</button>
        </div>
      </div>
    </section>

    <!-- Screen 2: Control Detail -->
    <section class="screen" id="screen-control-detail" data-region="control-detail" aria-label="LED Controller Settings">
      <div class="screen-content">
        <header class="detail-header" data-region="detail-header">
          <button class="back-btn" id="backBtn" aria-label="Back to device list">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h1 class="detail-title" id="detailTitle">Living Room</h1>
        </header>

        <div class="control-section" data-region="power-control">
          <span class="control-label">Power</span>
          <button class="large-power-toggle off" id="largePowerToggle" role="switch" aria-checked="false" aria-label="Turn on Living Room lights">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 20.77 15"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          </button>
        </div>

        <div class="control-section" data-region="intensity-control" id="intensitySection">
          <div class="intensity-header">
            <span class="control-label">Intensity</span>
            <div>
              <span class="intensity-value" id="intensityValue">75</span><span class="intensity-unit">%</span>
            </div>
          </div>
          <div class="slider-container" role="slider" aria-label="Light intensity" aria-valuemin="0" aria-valuemax="100" aria-valuenow="75" tabindex="0" id="intensitySlider">
            <div class="slider-track">
              <div class="slider-fill" id="intensityFill" style="width: 75%;"></div>
            </div>
            <div class="slider-thumb" id="intensityThumb"></div>
            <div class="slider-marks" aria-hidden="true">
              <span class="slider-mark"></span>
              <span class="slider-mark"></span>
              <span class="slider-mark"></span>
              <span class="slider-mark"></span>
              <span class="slider-mark"></span>
            </div>
          </div>
        </div>

        <div class="control-section" data-region="color-temp-control">
          <span class="control-label">Color Temperature</span>
          <div class="color-temp-picker" id="colorTempPicker" role="radiogroup" aria-label="Color temperature">
            <button class="temp-segment" data-temp="warm" role="radio" aria-checked="false" aria-label="Warm white, 2700K">
              <svg class="temp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span class="temp-label">Warm</span>
            </button>
            <button class="temp-segment active" data-temp="neutral" role="radio" aria-checked="true" aria-label="Neutral white, 4000K">
              <svg class="temp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <span class="temp-label">Neutral</span>
            </button>
            <button class="temp-segment" data-temp="cool" role="radio" aria-checked="false" aria-label="Cool white, 6500K">
              <svg class="temp-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/><circle cx="12" cy="12" r="4"/></svg>
              <span class="temp-label">Cool</span>
            </button>
          </div>
        </div>

        <button class="quick-off-btn" id="quickOffBtn" data-region="quick-off">Turn Off</button>
      </div>
    </section>

    <!-- Screen 3: Circular Complication -->
    <section class="screen" id="screen-complication-circular" data-region="complication-circular" aria-label="Circular complication">
      <div class="complication-screen">
        <div class="complication-circular on" id="circularComplication" style="--device-color: #ff6b35; --device-color-bright: #ff9f0a;">
          <div class="complication-ring"></div>
          <svg class="complication-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64A9 9 0 1 1 20.77 15"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
          <span class="complication-label">On</span>
        </div>
        <p style="font-size: 12px; color: var(--fg-secondary);">Circular — Graphic Bezel</p>
      </div>
    </section>

    <!-- Screen 4: Modular Complication -->
    <section class="screen" id="screen-complication-modular" data-region="complication-modular" aria-label="Modular complication">
      <div class="complication-screen">
        <div class="complication-modular">
          <div class="modular-color" id="modularColor" style="background: #ff6b35;"></div>
          <div class="modular-info">
            <div class="modular-name" id="modularName">Living Room</div>
            <div class="modular-status on" id="modularStatus">On · 75%</div>
          </div>
          <div class="power-toggle modular-toggle">
            <input type="checkbox" id="modularPowerToggle" checked aria-label="Living Room power">
            <div class="toggle-track">
              <div class="toggle-thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18.36 6.64A9 9 0 1 1 20.77 15"/><line x1="12" y1="2" x2="12" y2="12"/></svg></div>
            </div>
          </div>
        </div>
        <p style="font-size: 12px; color: var(--fg-secondary);">Modular — Graphic Rectangular</p>
      </div>
    </section>
  </main>

  <script>
    // ===== Design Tokens & Data =====
    const devices = [
      { id: '1', name: 'Living Room', room: 'Main Floor', color: '#ff6b35', colorBright: '#ff9f0a', status: 'connected', power: true, intensity: 75, temp: 'neutral' },
      { id: '2', name: 'Bedroom', room: 'Upper Floor', color: '#007aff', colorBright: '#5e5ce6', status: 'connected', power: false, intensity: 50, temp: 'warm' },
      { id: '3', name: 'Kitchen', room: 'Main Floor', color: '#34c759', colorBright: '#6ae67a', status: 'connecting', power: true, intensity: 100, temp: 'cool' },
      { id: '4', name: 'Office', room: 'Upper Floor', color: '#af52de', colorBright: '#d9a3ff', status: 'disconnected', power: false, intensity: 30, temp: 'neutral' },
      { id: '5', name: 'Patio', room: 'Outdoor', color: '#ff2d92', colorBright: '#ff7ad1', status: 'connected', power: true, intensity: 60, temp: 'warm' },
    ];

    let currentDevice = devices[0];
    let currentScreen = 'device-list';
    let intensityValue = 75;

    // ===== DOM Elements =====
    const screens = {
      'device-list': document.getElementById('screen-device-list'),
      'control-detail': document.getElementById('screen-control-detail'),
      'complication-circular': document.getElementById('screen-complication-circular'),
      'complication-modular': document.getElementById('screen-complication-modular'),
    };
    const deviceList = document.getElementById('deviceList');
    const emptyState = document.getElementById('emptyState');
    const errorState = document.getElementById('errorState');
    const hapticOverlay = document.getElementById('hapticOverlay');

    // Control detail elements
    const detailTitle = document.getElementById('detailTitle');
    const largePowerToggle = document.getElementById('largePowerToggle');
    const intensityValueEl = document.getElementById('intensityValue');
    const intensityFill = document.getElementById('intensityFill');
    const intensitySlider = document.getElementById('intensitySlider');
    const intensityThumb = document.getElementById('intensityThumb');
    const colorTempPicker = document.getElementById('colorTempPicker');
    const quickOffBtn = document.getElementById('quickOffBtn');
    const backBtn = document.getElementById('backBtn');

    // Complication elements
    const circularComplication = document.getElementById('circularComplication');
    const modularColor = document.getElementById('modularColor');
    const modularName = document.getElementById('modularName');
    const modularStatus = document.getElementById('modularStatus');
    const modularPowerToggle = document.getElementById('modularPowerToggle');

    // ===== Haptic Feedback =====
    function triggerHaptic(type = 'light') {
      hapticOverlay.classList.add('active');
      setTimeout(() => hapticOverlay.classList.remove('active'), type === 'heavy' ? 300 : 150);
      if (navigator.vibrate) {
        navigator.vibrate(type === 'heavy' ? [50, 30, 50] : type === 'medium' ? 30 : 10);
      }
    }

    // ===== Screen Management =====
    function showScreen(screenName) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[screenName]?.classList.add('active');
      currentScreen = screenName;

      document.querySelectorAll('.state-switcher button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.state === screenName);
        btn.setAttribute('aria-pressed', btn.dataset.state === screenName);
      });
    }

    // ===== Device List Rendering =====
    function renderDeviceList(deviceArray = devices) {
      deviceList.innerHTML = '';
      if (deviceArray.length === 0) {
        emptyState.style.display = 'block';
        errorState.style.display = 'none';
        return;
      }
      emptyState.style.display = 'none';
      errorState.style.display = 'none';

      deviceArray.forEach(device => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="device-row" data-device-id="${device.id}" role="button" tabindex="0" aria-label="${device.name}, ${device.room}, ${device.power ? 'On' : 'Off'}, ${device.intensity}% intensity, ${device.status}">
            <div class="device-color-preview" style="background: ${device.color};"></div>
            <div class="device-info">
              <span class="device-name">${device.name}</span>
              <span class="device-room">${device.room}</span>
            </div>
            <span class="status-dot ${device.status}" aria-label="${device.status === 'connected' ? 'Connected' : device.status === 'connecting' ? 'Connecting' : 'Disconnected'}"></span>
            <label class="power-toggle">
              <input type="checkbox" ${device.power ? 'checked' : ''} aria-label="${device.name} power">
              <div class="toggle-track">
                <div class="toggle-thumb">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M18.36 6.64A9 9 0 1 1 20.77 15"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                </div>
              </div>
            </label>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        `;
        deviceList.appendChild(li);
      });

      // Attach listeners
      deviceList.querySelectorAll('.device-row').forEach(row => {
        row.addEventListener('click', (e) => {
          if (e.target.closest('.power-toggle')) return;
          const deviceId = row.dataset.deviceId;
          openControlDetail(deviceId);
        });
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const deviceId = row.dataset.deviceId;
            openControlDetail(deviceId);
          }
        });
      });

      deviceList.querySelectorAll('.power-toggle input').forEach(input => {
        input.addEventListener('change', (e) => {
          e.stopPropagation();
          const deviceId = e.target.closest('.device-row').dataset.deviceId;
          const device = devices.find(d => d.id === deviceId);
          if (device) {
            device.power = e.target.checked;
            triggerHaptic('light');
            renderDeviceList();
            if (currentDevice.id === deviceId) updateControlDetail();
          }
        });
      });
    }

    // ===== Control Detail =====
    function openControlDetail(deviceId) {
      currentDevice = devices.find(d => d.id === deviceId) || devices[0];
      updateControlDetail();
      showScreen('control-detail');
      triggerHaptic('medium');
    }

    function updateControlDetail() {
      detailTitle.textContent = currentDevice.name;
      largePowerToggle.classList.toggle('on', currentDevice.power);
      largePowerToggle.classList.toggle('off', !currentDevice.power);
      largePowerToggle.setAttribute('aria-checked', currentDevice.power);
      largePowerToggle.setAttribute('aria-label', `${currentDevice.power ? 'Turn off' : 'Turn on'} ${currentDevice.name} lights`);

      intensityValue = currentDevice.intensity;
      intensityValueEl.textContent = intensityValue;
      intensityFill.style.width = `${intensityValue}%`;
      intensitySlider.setAttribute('aria-valuenow', intensityValue);
      positionThumb(intensityValue);

      colorTempPicker.querySelectorAll('.temp-segment').forEach(seg => {
        const isActive = seg.dataset.temp === currentDevice.temp;
        seg.classList.toggle('active', isActive);
        seg.setAttribute('aria-checked', isActive);
      });

      intensitySection.style.opacity = currentDevice.power ? '1' : '0.4';
      intensitySection.style.pointerEvents = currentDevice.power ? 'auto' : 'none';
      colorTempPicker.style.opacity = currentDevice.power ? '1' : '0.4';
      colorTempPicker.style.pointerEvents = currentDevice.power ? 'auto' : 'none';
    }

    function positionThumb(value) {
      const percent = Math.max(0, Math.min(100, value));
      intensityThumb.style.left = `${percent}%`;
    }

    // ===== Intensity Slider Interaction =====
    let isDragging = false;
    function handleSliderMove(clientX) {
      const rect = intensitySlider.getBoundingClientRect();
      const percent = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      const stepped = Math.round(percent / 5) * 5;
      intensityValue = stepped;
      intensityValueEl.textContent = intensityValue;
      intensityFill.style.width = `${intensityValue}%`;
      intensitySlider.setAttribute('aria-valuenow', intensityValue);
      positionThumb(intensityValue);
      currentDevice.intensity = intensityValue;
    }

    intensitySlider.addEventListener('mousedown', (e) => {
      isDragging = true;
      handleSliderMove(e.clientX);
      triggerHaptic('light');
    });
    intensitySlider.addEventListener('touchstart', (e) => {
      isDragging = true;
      handleSliderMove(e.touches[0].clientX);
      triggerHaptic('light');
    }, { passive: true });

    window.addEventListener('mousemove', (e) => { if (isDragging) handleSliderMove(e.clientX); });
    window.addEventListener('touchmove', (e) => { if (isDragging) handleSliderMove(e.touches[0].clientX); }, { passive: true });
    window.addEventListener('mouseup', () => { if (isDragging) { isDragging = false; triggerHaptic('light'); } });
    window.addEventListener('touchend', () => { if (isDragging) { isDragging = false; triggerHaptic('light'); } });

    // Keyboard support for slider
    intensitySlider.addEventListener('keydown', (e) => {
      let newValue = intensityValue;
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') newValue = Math.min(100, intensityValue + 5);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') newValue = Math.max(0, intensityValue - 5);
      else if (e.key === 'Home') newValue = 0;
      else if (e.key === 'End') newValue = 100;
      else return;
      e.preventDefault();
      intensityValue = newValue;
      intensityValueEl.textContent = intensityValue;
      intensityFill.style.width = `${intensityValue}%`;
      intensitySlider.setAttribute('aria-valuenow', intensityValue);
      positionThumb(intensityValue);
      currentDevice.intensity = intensityValue;
      triggerHaptic('light');
    });

    // ===== Large Power Toggle =====
    largePowerToggle.addEventListener('click', () => {
      currentDevice.power = !currentDevice.power;
      updateControlDetail();
      renderDeviceList();
      triggerHaptic('medium');
    });
    largePowerToggle.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        largePowerToggle.click();
      }
    });

    // ===== Color Temperature Picker =====
    colorTempPicker.querySelectorAll('.temp-segment').forEach(seg => {
      seg.addEventListener('click', () => {
        currentDevice.temp = seg.dataset.temp;
        updateControlDetail();
        updateComplications();
        triggerHaptic('light');
      });
      seg.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          seg.click();
        }
      });
    });

    // ===== Quick Off Button =====
    quickOffBtn.addEventListener('click', () => {
      currentDevice.power = false;
      currentDevice.intensity = 0;
      updateControlDetail();
      renderDeviceList();
      updateComplications();
      triggerHaptic('heavy');
    });

    // ===== Back Button =====
    backBtn.addEventListener('click', () => {
      showScreen('device-list');
      triggerHaptic('light');
    });

    // ===== Complications =====
    function updateComplications() {
      circularComplication.style.setProperty('--device-color', currentDevice.color);
      circularComplication.style.setProperty('--device-color-bright', currentDevice.colorBright);
      circularComplication.classList.toggle('on', currentDevice.power);
      circularComplication.classList.toggle('off', !currentDevice.power);
      circularComplication.querySelector('.complication-label').textContent = currentDevice.power ? 'On' : 'Off';

      modularColor.style.background = currentDevice.color;
      modularName.textContent = currentDevice.name;
      modularStatus.textContent = currentDevice.power ? `On · ${currentDevice.intensity}%` : 'Off';
      modularStatus.classList.toggle('on', currentDevice.power);
      modularStatus.classList.toggle('off', !currentDevice.power);
      modularPowerToggle.checked = currentDevice.power;
    }

    modularPowerToggle.addEventListener('change', () => {
      currentDevice.power = modularPowerToggle.checked;
      updateComplications();
      updateControlDetail();
      renderDeviceList();
      triggerHaptic('light');
    });

    // ===== State Switcher =====
    document.querySelectorAll('.state-switcher button').forEach(btn => {
      btn.addEventListener('click', () => {
        const state = btn.dataset.state;
        if (state === 'empty') { renderDeviceList([]); showScreen('device-list'); }
        else if (state === 'error') { emptyState.style.display = 'none'; errorState.style.display = 'block'; showScreen('device-list'); }
        else { renderDeviceList(); showScreen(state); }
      });
    });

    // URL parameter support
    const urlState = new URLSearchParams(window.location.search).get('state');
    if (urlState) {
      const btn = document.querySelector(`.state-switcher button[data-state="${urlState}"]`);
      if (btn) btn.click();
    }

    // Retry button
    errorState.querySelector('.retry-btn').addEventListener('click', () => {
      renderDeviceList();
      triggerHaptic('light');
    });

    // Digital Crown simulation (wheel scroll on slider)
    intensitySlider.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -5 : 5;
      intensityValue = Math.max(0, Math.min(100, intensityValue + delta));
      intensityValueEl.textContent = intensityValue;
      intensityFill.style.width = `${intensityValue}%`;
      intensitySlider.setAttribute('aria-valuenow', intensityValue);
      positionThumb(intensityValue);
      currentDevice.intensity = intensityValue;
      triggerHaptic('light');
    }, { passive: false });

    // ===== Init =====
    renderDeviceList();
    updateComplications();
  </script>
</body>
</html>
